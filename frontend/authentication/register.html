<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../js/auth.js?v=20261018a"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firqui Jewels | Register</title>

    <link rel="stylesheet" href="register.css?v=20261018a">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;600&family=Hurricane&family=Imprima&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <link rel="stylesheet" href="../css/site.css?v=20261018a">
</head>

<body>

<main class="register-page">

    <!-- HEADER -->
    <header class="register-header">

        <a href="../index.html" class="brand-logo">
            <img src="../assets/lastfirqui.png" alt="Firqui Jewels">
        </a>

        <a href="../index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Home</span>
        </a>

    </header>


    <!-- REGISTER -->
    <section class="register-content">

        <div class="register-card">

            <!-- TITLE -->
            <div class="register-heading">

                <span>Welcome to</span>

                <h1>Firqui</h1>

                <p>Create your account</p>

            </div>


            <!-- FORM -->
            <form id="registerForm">


                <!-- FULL NAME -->
                <div class="input-group">

                    <div class="input-wrapper">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Full Name"
                            required
                        >

                    </div>

                </div>


                <!-- MOBILE -->
                <div class="input-group">

                    <div class="input-wrapper">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            id="mobile"
                            placeholder="Mobile Number"
                            maxlength="10"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->
                <div class="input-group">

                    <div class="input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Email Address"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="input-group">

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm Password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="confirmPasswordToggle"
                        >
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>


                              <!-- MESSAGE -->
                <div
                    id="registerMessage"
                    class="register-message"
                ></div>

            </form>

            <!-- LOGIN -->
            <div class="login-section">

                <span>Already have an account?</span>

                <button
                    type="button"
                    id="switchToLogin"
                >
                    Login
                </button>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="register-footer">

        <span>© 2026 - FIRQUI JEWELS</span>

        <span>Powered by GENEXA TECH</span>

    </footer>

</main>


<script>
    const modalParams =
        new URLSearchParams(window.location.search);

    if (modalParams.get("modal") === "true") {
        document.body.classList.add("modal-register");
    }
</script>

<script src="register.js?v=20261018a"></script>

    <script src="../js/site-nav.js?v=20261018a"></script>
</body>
</html>
