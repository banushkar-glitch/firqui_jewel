<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firqui Jewels | Login</title>

    <link rel="stylesheet" href="login.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;600&family=Hurricane&family=Imprima&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <main class="login-page">

        <!-- Decorative left shape -->
        <div class="login-decoration login-decoration-left"></div>

        <!-- Decorative right shape -->
        <div class="login-decoration login-decoration-right"></div>


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="login-header">

            <a href="../index.html" class="brand-logo">
                <img src="../assets/Logo Pink 1.png" alt="Firqui Jewels">
            </a>

           <a href="../index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Home</span>
            </a>

        </header>


        <!-- =================================================
             LOGIN CONTENT
        ================================================== -->

        <section class="login-content">

            <div class="login-card">

                <!-- Title -->

                <div class="login-heading">

                    <span class="login-small-title">
                        Welcome to
                    </span>

                    <h1>
                        Firqui
                    </h1>

                    <p>
                        Sign in to continue your journey
                    </p>

                </div>


                <!-- Login Form -->

                <form id="loginForm" class="login-form">

                    <!-- Email -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="text"
                                id="email"
                                name="email"
                                placeholder="Enter email or mobile number"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- Remember + Forgot -->

                    <div class="login-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span class="custom-checkbox"></span>

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a href="forgot-password.html" class="forgot-password">
                            Forgot Password?
                        </a>

                    </div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login
                    </button>


                    <!-- Message -->

                    <div
                        id="loginMessage"
                        class="login-message"
                    ></div>

                </form>


                <!-- Register -->

                <div class="register-section">

                    <span>
                        Don't have an account?
                    </span>

                   <a href="#" id="openRegister">
    Create Account
</a>

                </div>

            </div>

        </section>


        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="login-footer">

            <span>
                © 2026 - FIRQUI JEWELS
            </span>

            <span>
                Powered by GENEXA TECH
            </span>

        </footer>

    </main>

<script>
    const urlParams =
        new URLSearchParams(window.location.search);

    if (urlParams.get("modal") === "true") {

        document.body.classList.add("modal-login-mode");

    }
</script>
    <script src="login.js"></script>

</body>
</html>
