<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="../js/auth.js?v=20261018a"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Firqui Jewels | Forgot Password</title>

    <link rel="stylesheet" href="forgot-password.css?v=20261018a">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;500;600&family=Hurricane&family=Imprima&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/site.css?v=20261018a">
</head>

<body>

    <!-- Website Background Backdrop (Visible in standalone mode) -->
    <div class="website-backdrop" id="websiteBackdrop" aria-hidden="true">
        <iframe src="../index.html" class="backdrop-iframe" tabindex="-1" aria-hidden="true"></iframe>
        <div class="backdrop-overlay"></div>
    </div>

    <!-- =====================================================
         FORGOT PASSWORD PAGE
    ====================================================== -->
    <main class="auth-page">

        <!-- Decorative left shape -->
        <div class="auth-decoration auth-decoration-left" aria-hidden="true"></div>

        <!-- Decorative right shape -->
        <div class="auth-decoration auth-decoration-right" aria-hidden="true"></div>

        <!-- =================================================
             HEADER
        ================================================== -->
        <header class="auth-header">
            <a href="../index.html" class="brand-logo" aria-label="Firqui Jewels Home">
                <img src="../assets/lastfirqui.png" alt="Firqui Jewels">
            </a>

            <a href="../index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Home</span>
            </a>
        </header>

        <!-- =================================================
             CONTENT
        ================================================== -->
        <section class="auth-content">

            <div class="auth-card">

                <!-- Heading -->
                <div class="auth-heading">
                    <span class="auth-small-title">
                        Welcome to
                    </span>

                    <h1>
                        Firqui
                    </h1>

                    <h2 class="auth-subheading">
                        Forgot Password?
                    </h2>

                    <p class="auth-instruction">
                        Enter your registered email address and we'll send you a link to reset your password.
                    </p>
                </div>

                <!-- Forgot Password Form -->
                <form id="forgotPasswordForm" class="auth-form" novalidate>

                    <!-- Email Input Group -->
                    <div class="input-group">
                        <label for="email">Email Address</label>

                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope" aria-hidden="true"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="field-error" id="emailError" role="alert" aria-live="polite"></div>
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="auth-button"
                        id="submitBtn"
                    >
                        <span class="btn-text">Send Reset Link</span>
                        <span class="btn-spinner" aria-hidden="true">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                        </span>
                    </button>

                    <!-- Global Status Message -->
                    <div
                        id="authMessage"
                        class="auth-message"
                        role="status"
                        aria-live="polite"
                    ></div>

                </form>

                <!-- Back to Login Section -->
                <div class="switch-section">
                    <span>Remember your password?</span>
                    <a href="login.html" id="backToLogin">
                        Back to Login
                    </a>
                </div>

            </div>

        </section>

        <!-- =================================================
             FOOTER
        ================================================== -->
        <footer class="auth-footer">
            <span>
                © 2026 - FIRQUI JEWELS
            </span>

            <span>
                Powered by GENEXA TECH
            </span>
        </footer>

    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("modal") === "true" || window.self !== window.top) {
            document.body.classList.add("modal-auth-mode");
            const backdrop = document.getElementById("websiteBackdrop");
            if (backdrop) backdrop.remove();
        }
    </script>
    <script src="forgot-password.js?v=20261018a"></script>

    <script src="../js/site-nav.js?v=20261018a"></script>
</body>
</html>
