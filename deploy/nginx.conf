# Firqui Jewels - Nginx site (template)
# setup-server.sh replaces __DOMAIN__ and installs this as /etc/nginx/sites-available/firqui.
# Certbot later adds the HTTPS (443) settings to the installed copy.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/firqui;
    index index.html;

    # Product videos can be up to 50MB
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Spring Boot API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Product images and videos uploaded from the admin panel
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
    }

    # Old links that still include the local folder name
    location /frontend/ {
        rewrite ^/frontend/(.*)$ /$1 permanent;
    }

    location /assets/ {
        expires 30d;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
