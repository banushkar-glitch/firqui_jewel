# =====================================================
# FIRQUI JEWELS
# APPLICATION
# =====================================================
# Defaults below are for LOCAL DEVELOPMENT only.
# Production runs with SPRING_PROFILES_ACTIVE=prod, which loads
# application-prod.properties and takes every secret from environment variables.

spring.application.name=Firqui


# =====================================================
# POSTGRESQL DATABASE
# =====================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/firqui_jewels}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Abhi@2004}
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# SERVER
# =====================================================

server.port=8080
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# =====================================================
# SECURITY & JWT CONFIGURATION
# =====================================================

app.jwt.secret=${JWT_SECRET:FirquiJewelsSecureJwtSigningSecretKeyAtLeast256BitsLongForHmacSha256Security2026}
app.jwt.expiration-ms=86400000

# =====================================================
# DEFAULT ADMIN ACCOUNT (created on first startup if missing)
# =====================================================

app.admin.email=${ADMIN_EMAIL:admin@firqui.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed.demo-user=true

# =====================================================
# CORS CONFIGURATION
# Allowed origin patterns for frontend requests ("null" = pages opened from file://)
# =====================================================

app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,null

# =====================================================
# FRONTEND RESET PASSWORD URL
# =====================================================

app.frontend.reset-password-url=http://localhost:5500/authentication/reset-password.html

# =====================================================
# MAIL (SMTP) CONFIGURATION
# Configurable via environment variables (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD)
# =====================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
