# =====================================================
# FIRQUI JEWELS
# APPLICATION
# =====================================================

spring.application.name=Firqui


# =====================================================
# POSTGRESQL DATABASE
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/firqui_jewels
spring.datasource.username=postgres
spring.datasource.password=Abhi@2004
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# SERVER
# =====================================================

server.port=8080
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# =====================================================
# SECURITY & JWT CONFIGURATION
# =====================================================

app.jwt.secret=${JWT_SECRET:FirquiJewelsSecureJwtSigningSecretKeyAtLeast256BitsLongForHmacSha256Security2026}
app.jwt.expiration-ms=86400000

# =====================================================
# CORS CONFIGURATION
# Allowed origins for frontend authentication requests
# =====================================================

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080

# =====================================================
# FRONTEND RESET PASSWORD URL
# =====================================================

app.frontend.reset-password-url=http://localhost:5500/authentication/reset-password.html

# =====================================================
# MAIL (SMTP) CONFIGURATION (Google Workspace / Gmail for info@firquijewels.com)
# Configurable via environment variables or directly below.
# 
# QUICK SETUP TO RECEIVE EMAILS AT info@firquijewels.com:
# 1. Ensure 2-Step Verification is ON for info@firquijewels.com (or sender Gmail).
# 2. Go to: https://myaccount.google.com/apppasswords
# 3. Generate a 16-character App Password (e.g. named "Firqui Website").
# 4. Paste the 16-character password into spring.mail.password below.
# =====================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:info@firquijewels.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:YOUR_GOOGLE_APP_PASSWORD_HERE}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# In production, require actual email dispatch (do not falsely claim success)
app.mail.allow-dev-fallback=false

# =====================================================
# CONTACT US NOTIFICATIONS
# =====================================================
app.contact.admin-email=${ADMIN_EMAIL:info@firquijewels.com}