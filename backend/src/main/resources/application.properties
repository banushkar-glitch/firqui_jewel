# =====================================================
# FIRQUI JEWELS
# APPLICATION
# =====================================================

spring.application.name=Firqui


# =====================================================
# POSTGRESQL DATABASE
# =====================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/firqui_jewels
spring.datasource.username=postgres
spring.datasource.password=Abhi@2004
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# SERVER
# =====================================================

server.port=8080
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# =====================================================
# SECURITY & JWT CONFIGURATION
# =====================================================

app.jwt.secret=${JWT_SECRET:FirquiJewelsSecureJwtSigningSecretKeyAtLeast256BitsLongForHmacSha256Security2026}
app.jwt.expiration-ms=86400000

# =====================================================
# CORS CONFIGURATION
# Allowed origins for frontend authentication requests
# =====================================================

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080

# =====================================================
# FRONTEND RESET PASSWORD URL
# =====================================================

app.frontend.reset-password-url=http://localhost:5500/authentication/reset-password.html

# =====================================================
# MAIL (SMTP) CONFIGURATION
# Configurable via environment variables (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD)
# =====================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true