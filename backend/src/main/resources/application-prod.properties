# =====================================================
# FIRQUI JEWELS - PRODUCTION PROFILE
# Active when SPRING_PROFILES_ACTIVE=prod
# =====================================================
# No secret is stored in this file. Every ${NAME} is read from the server's
# environment file /etc/firqui/firqui.env (template: deploy/firqui.env.example).
# A ${NAME} with no default MUST be set there: the app refuses to start without
# it, so production can never run on a development secret.

# =====================================================
# POSTGRESQL DATABASE
# =====================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =====================================================
# SERVER (reachable only through Nginx on the same machine)
# =====================================================

server.address=127.0.0.1
# Nginx passes the visitor's address and https; needed for login throttling and secure cookies
server.forward-headers-strategy=native
server.error.include-stacktrace=never
server.error.include-message=never

# =====================================================
# SECURITY
# =====================================================

app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# Login session cookie is only sent over HTTPS
app.auth.cookie-secure=true

# Comma separated, e.g. https://firquijewels.com,https://www.firquijewels.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =====================================================
# DATA
# =====================================================

# A real shop starts empty: no demo customer, no placeholder products
app.seed.demo-user=false
app.seed.demo-products=false

# The one-time test-data wipe must never run by accident in production
app.maintenance.reset-test-data=false

# =====================================================
# FRONTEND
# =====================================================

app.frontend.reset-password-url=${FRONTEND_URL}/authentication/reset-password.html
app.frontend.url=${FRONTEND_URL}

# =====================================================
# EMAIL (order notifications, Contact Us, password reset)
# =====================================================
# Gmail / Google Workspace: SPRING_MAIL_PASSWORD is a 16-character App Password.
# Left empty, the site runs normally but sends no email.

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Give up on a slow mail server instead of holding a request open
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.allow-dev-fallback=false

# Where Contact Us messages and new-order notifications are delivered
app.contact.admin-email=${CONTACT_EMAIL:info@firquijewels.com}

# =====================================================
# PAYMENTS
# =====================================================

# UPI account that receives customer payments (shown as a QR with the exact order amount)
app.upi.id=${UPI_ID}
app.upi.payee-name=${UPI_PAYEE_NAME:FIRQUI JEWELS}
