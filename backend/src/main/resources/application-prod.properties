# =====================================================
# FIRQUI JEWELS - PRODUCTION PROFILE
# Active when SPRING_PROFILES_ACTIVE=prod
# =====================================================
# Every value written as ${NAME} with no default MUST be set as an
# environment variable (see deploy/firqui.env.example). The app refuses
# to start if one is missing, so it can never run on a development secret.

# =====================================================
# POSTGRESQL DATABASE
# =====================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =====================================================
# SERVER (reachable only through Nginx on the same machine)
# =====================================================

server.address=127.0.0.1
server.forward-headers-strategy=native
server.error.include-stacktrace=never

# =====================================================
# SECURITY
# =====================================================

app.jwt.secret=${JWT_SECRET}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.seed.demo-user=false

# Login session cookie is only sent over HTTPS
app.auth.cookie-secure=true

# Comma separated, e.g. https://firquijewels.com,https://www.firquijewels.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =====================================================
# FRONTEND
# =====================================================

app.frontend.reset-password-url=${FRONTEND_URL}/authentication/reset-password.html
app.frontend.url=${FRONTEND_URL}

# UPI account that receives customer payments (shown as a QR with the exact order amount)
app.upi.id=${UPI_ID:nehaa067@icici}
app.upi.payee-name=${UPI_PAYEE_NAME:FIRQUI JEWELS}
